<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dom – ukážka dashboardu (TinkerMyHome)</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<!--
  Wall tablet – Home Assistant (Waveshare 10.1DP-CAPLCD, 1280×800)
  Umiestnenie: /config/www/wall.html  →  URL: /local/wall.html

  Zdroj dát (automaticky):
   1) vložené ako Webpage karta v HA  → berie dáta priamo z HA (bez tokenu)
   2) otvorené priamo v prehliadači   → /local/wall.html#token=<long-lived token>
   3) inak                            → demo režim s ukážkovými dátami
  Parametre adresy: ?theme=dark|hc|auto  ·  ?clock=a|b|c|d (predvolené b)
  Súbor neobsahuje žiadne heslá ani tokeny. Token nikdy nevpisuj do súboru – /local/ je dostupné bez prihlásenia.
  Na token si sprav samostatného používateľa bez práv správcu.
  Verejná ukážka z tinkermyhome.com (Igy) – entity v E si prepíš na svoje.
-->
<style>
  :root { --l: #141c2c; --r: #0a0e17; --text: #f4f6fb; --muted: #8b95a7; --faint: #5f6b7f; --rh: 98px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--r); color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .tn { font-variant-numeric: tabular-nums; }
  svg.i { width: 1em; height: 1em; vertical-align: -.12em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .app { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: grid; grid-template-columns: 39vw 1fr; }

  /* ---------- Ľavý panel ---------- */
  .lp { background: var(--l); padding: 3.75vh 2.95vw 3.5vh; display: flex; flex-direction: column; min-height: 0; }
  .clk { font-weight: 200; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .clk.a { font-size: 19.75vh; line-height: .9; white-space: nowrap; } .clk.a i { font-style: normal; opacity: .4; }
  .clk.b { font-size: 23vh; line-height: .82; text-align: center; }
  .clk.b hr { border: 0; height: 2px; background: rgba(255,255,255,.12); margin: 1.5vh 2.3vw; }
  .clk.c { font-size: 25vh; line-height: .82; text-align: right; } .clk.c span { color: #7d8aa3; }
  .clk.d { display: flex; justify-content: center; gap: .8vw; } .clk.d b { font-weight: 200; font-size: 25vh; line-height: .82; } .clk.d span { font-size: 11.5vh; color: #7d8aa3; margin-top: .8vh; }
  .date { font: 300 3.1vh Inter; color: #a5b8d8; margin-top: 2vh; text-align: center; }
  .weather { font: 300 3.5vh Inter; margin-top: .7vh; text-align: center; cursor: pointer; }
  .weather svg { color: #fbbf24; } .weather .more { color: var(--faint); font-size: .8em; }
  .cnts { display: flex; gap: 1.1vw; margin-top: auto; margin-bottom: 1.75vh; }
  .cnt { width: 7.5vw; height: 10.5vh; border-radius: 20px; background: rgba(255,255,255,.06); display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer; color: #7d8aa3; }
  .cnt .ic { font-size: 3.25vh; } .cnt b { font: 300 3.75vh/1 Inter; margin-top: .5vh; color: #cbd5e1; font-variant-numeric: tabular-nums; }
  .cnt.win { background: rgba(96,165,250,.16); color: #60a5fa; } .cnt.win b { color: #dbeafe; }
  .cnt.door { background: rgba(251,146,60,.16); color: #fb923c; } .cnt.door b { color: #ffedd5; }
  .cnt.lit { background: rgba(251,191,36,.16); color: #fbbf24; } .cnt.lit b { color: #fef3c7; }
  .cnt.lit .ic { filter: drop-shadow(0 0 8px rgba(251,191,36,.6)); }
  .bt { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: var(--rh); gap: 1.5vh; }
  .act { display: flex; gap: .95vw; align-items: center; padding: 0 1.55vw; border-radius: 16px; border: 0; background: rgba(255,255,255,.07);
    color: var(--text); font: 400 2.65vh Inter; text-align: left; cursor: pointer; outline: none; transition: transform .15s, background .4s; min-width: 0; }
  .act span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .act small { display: block; font-size: 1.9vh; opacity: .7; margin-top: .25vh; overflow: hidden; text-overflow: ellipsis; }
  .act svg { width: 3.5vh; height: 3.5vh; flex: none; }
  .act:active, .act.pressed { transform: scale(.96); }
  .act.blinds svg { color: #fbbf24; }
  .act.armed { background: rgba(45,212,160,.2); color: #86efc8; }
  .act.disarmed svg { color: #f87171; }
  .act.vac.run { background: rgba(56,189,248,.2); color: #bae6fd; }
  .act.vac.err svg { color: #f87171; }
  .act.cam.motion { background: rgba(248,113,113,.3); color: #fecaca; }

  /* ---------- Stupnice ---------- */
  .r { padding: 3.75vh 2.95vw 3.5vh; display: flex; flex-direction: column; min-height: 0; }
  .rows { flex: 1; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; min-height: 0; }
  .row { display: grid; grid-template-columns: 2.95vw 11.7vw 1fr 8.6vw; align-items: center; gap: 1.25vw; }
  .row .ic { font-size: 3.75vh; }
  .row p { font: 500 2.75vh Inter; white-space: nowrap; } .row p .soc { font-weight: 400; color: var(--muted); margin-left: .4vw; }
  .row p small { display: block; font: 400 1.9vh Inter; color: #8391a7; margin-top: .25vh; }
  .seg { display: grid; grid-template-columns: repeat(20, 1fr); gap: .3vw; height: 4.5vh; }
  .seg i { border-radius: 4px; background: rgba(255,255,255,.07); }
  .row b { text-align: right; font: 300 3.75vh Inter; color: var(--muted); white-space: nowrap; } .row b small { font-size: 1.9vh; color: var(--faint); margin-left: .3vw; }

  /* ---------- Kúrenie: kotol + izby ---------- */
  .heat { margin-top: 2.75vh; padding-top: 2.25vh; border-top: 1px solid rgba(255,255,255,.08); display: flex; align-items: stretch; gap: .95vw; }
  .kotol { width: 6.6vw; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5vh; color: var(--faint); font: 400 1.9vh Inter; text-align: center; }
  .kotol .ic { font-size: 4.25vh; }
  .kotol.on { color: #fca5a5; } .kotol.on .ic { color: #f87171; filter: drop-shadow(0 0 8px rgba(248,113,113,.7)); }
  .room { position: relative; flex: 1; min-width: 0; border-radius: 16px; background: rgba(255,255,255,.05); padding: 1.5vh .95vw; cursor: pointer; display: flex; flex-direction: column; }
  .room:active { transform: scale(.97); }
  .room b { font: 300 4vh/1.1 Inter; } .room span { font: 500 2vh Inter; color: #cbd5e1; margin-top: .25vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room small { white-space: nowrap; font: 400 1.65vh Inter; color: #7c889c; overflow: hidden; text-overflow: ellipsis; }
  .room.h { background: rgba(248,113,113,.16); } .room.h b { color: #fecaca; } .room.h small { color: #fca5a5; }
  .room.o b { color: var(--faint); } .room.o small { color: #7fa8e0; }
  .room .wi { position: absolute; bottom: 1.5vh; right: .95vw; font-size: 2.5vh; color: #60a5fa; }

  /* ---------- Karty (detail) ---------- */
  .sheet { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(3,5,10,.72); display: flex; align-items: center; justify-content: center;
    z-index: 32; opacity: 0; pointer-events: none; transition: opacity .25s; }
  .sheet.show { opacity: 1; pointer-events: auto; }
  .card { width: 70vw; max-height: 92vh; overflow: hidden; border-radius: 34px; background: #151d2e; padding: 4.25vh 3.1vw 3.75vh; transition: background .6s; }
  .card.glow { background: radial-gradient(55% 60% at 50% 46%, rgba(248,113,113,.30), rgba(248,113,113,.08) 60%, transparent 80%), #151d2e; }
  .card.wide { width: 83vw; } .card.narrow { width: 59vw; }
  .hd { display: flex; align-items: flex-start; gap: 1.4vw; }
  .hd h2 { font: 400 4.25vh Inter; }
  .hd .st { display: flex; gap: 1.1vw; align-items: center; font: 400 2.5vh Inter; color: #94a3b8; margin-top: .75vh; }
  .hd .st .hot { color: #fca5a5; }
  .hd .st .wn { display: flex; gap: .45vw; align-items: center; color: #93c5fd; background: rgba(96,165,250,.16); padding: .6vh .95vw; border-radius: 99px; }
  .hd .now { margin-left: auto; text-align: right; } .hd .now small { display: block; font: 500 1.75vh Inter; letter-spacing: .14em; text-transform: uppercase; color: #94a3b8; }
  .hd .now b { font: 300 9vh/1 Inter; }
  .hd .btn { margin-left: auto; padding: 1.5vh 1.75vw; border-radius: 99px; background: rgba(255,255,255,.08); font: 400 2.4vh Inter; cursor: pointer; white-space: nowrap; }
  .hd .btn.dis { opacity: .35; pointer-events: none; }
  .hd .back { padding: 1.5vh 1.55vw; border-radius: 99px; background: rgba(255,255,255,.08); font: 400 2.4vh Inter; cursor: pointer; }
  .hint { text-align: center; font: 400 1.9vh Inter; color: #64748b; margin-top: 1.25vh; }

  /* termostat */
  .tgt { display: flex; align-items: center; justify-content: center; gap: 3.1vw; margin-top: 1.25vh; }
  .tgt button { width: 13.75vh; height: 13.75vh; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #fff; font: 200 8vh/1 Inter; cursor: pointer; }
  .tgt button:active { background: rgba(255,255,255,.16); transform: scale(.94); }
  .tgt .val { text-align: center; min-width: 23.5vw; } .tgt .val b { font: 200 17.5vh/1 Inter; letter-spacing: -.03em; }
  .tgt .val small { display: block; font: 500 1.9vh Inter; letter-spacing: .16em; text-transform: uppercase; color: #94a3b8; margin-top: .5vh; }
  .tgt .val b.pend { color: #fde68a; }
  .ruler { position: relative; height: 11.5vh; margin-top: 3.25vh; overflow: hidden; border-radius: 18px; background: rgba(0,0,0,.25); touch-action: none; cursor: grab;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  .ruler .trk { position: absolute; top: 0; bottom: 0; left: 50%; will-change: transform; }
  .ruler .tk { position: absolute; bottom: 0; width: 2px; background: rgba(255,255,255,.25); height: 2.75vh; margin-left: -1px; }
  .ruler .tk.m { height: 5vh; background: rgba(255,255,255,.5); }
  .ruler .tl { position: absolute; top: 1.5vh; transform: translateX(-50%); font: 400 2.25vh Inter; color: #94a3b8; }
  .ruler .mk { position: absolute; left: 50%; top: 5.25vh; bottom: 0; width: 4px; margin-left: -2px; border-radius: 2px; background: #f87171; box-shadow: 0 0 12px #f87171; }
  .floor { display: flex; align-items: center; gap: 1.25vw; margin-top: 2.25vh; padding: 1.75vh 1.55vw; border-radius: 18px; background: rgba(255,255,255,.05); font: 400 2.4vh Inter; color: #cbd5e1; }
  .floor .ic { font-size: 3.25vh; color: #fb923c; } .floor .g { flex: 1; } .floor small { color: #94a3b8; }
  .floor .fb { padding: 1.5vh 1.9vw; border-radius: 99px; background: rgba(255,255,255,.08); cursor: pointer; white-space: nowrap; }
  .floor .fb.on { background: rgba(251,146,60,.25); color: #fed7aa; }
  .card.off .tgt button, .card.off .ruler { opacity: .35; }

  /* svetlá */
  .lgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5vh .95vw; margin-top: 2.75vh; }
  .lr { position: relative; border-radius: 20px; background: rgba(255,255,255,.05); padding: 2.25vh 1.55vw; cursor: pointer; display: flex; flex-direction: column; min-height: 14vh; }
  .lr .ic { font-size: 3.25vh; color: #64748b; } .lr b { font: 500 2.6vh Inter; margin-top: 1vh; padding-right: 7.8vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lr small { font: 400 1.9vh Inter; color: #7c889c; margin-top: .25vh; padding-right: 7.8vw; }
  .lr.lit { background: rgba(251,191,36,.16); } .lr.lit .ic { color: #fbbf24; filter: drop-shadow(0 0 8px rgba(251,191,36,.7)); } .lr.lit small { color: #fcd34d; }
  .lr.na { opacity: .6; }
  .lr .tg { position: absolute; top: 0; right: 0; width: 10.2vw; height: 100%; }
  .lr .tg i { position: absolute; top: 2.25vh; right: 1.4vw; width: 6.55vw; height: 5.75vh; border-radius: 99px; background: rgba(255,255,255,.14); }
  .lr .tg i::after { content: ''; position: absolute; top: .5vh; left: .3vw; width: 4.75vh; height: 4.75vh; border-radius: 50%; background: #cbd5e1; transition: transform .2s; }
  .lr.lit .tg i { background: #f59e0b; } .lr.lit .tg i::after { transform: translateX(calc(6.55vw - 4.75vh - .6vw)); background: #fff; }
  .l2 .lr { min-height: 16vh; }

  /* energia dnes */
  .hd .chip { margin-left: auto; padding: 1.25vh 1.55vw; border-radius: 99px; background: rgba(251,146,60,.16); color: #fdba74; font: 500 2.25vh Inter; white-space: nowrap; }
  .eg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5vh .95vw; margin-top: 2.5vh; }
  .eg.two { grid-template-columns: 1fr 1fr; margin-top: 1.5vh; }
  .et { border-radius: 20px; background: rgba(255,255,255,.05); padding: 2vh 1.55vw; min-width: 0; }
  .et .eh { font: 500 1.9vh Inter; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; display: flex; align-items: center; gap: .5vw; }
  .et .eh svg { width: 2.5vh; height: 2.5vh; }
  .et > b { display: block; font: 300 6vh/1.1 Inter; margin-top: 1vh; } .et b i { font-style: normal; font-size: .4em; color: #94a3b8; margin-left: .35vw; }
  .et em { display: block; font-style: normal; font: 400 1.9vh Inter; color: #8391a7; margin-top: .5vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .duo { display: grid; grid-template-columns: 1fr 1fr; margin-top: 1vh; }
  .duo small { font: 400 1.9vh Inter; color: #94a3b8; } .duo b { display: block; font: 300 4.75vh/1.1 Inter; }
  .duo .dr { text-align: right; }
  .duo .dbar { grid-column: 1 / 3; display: flex; gap: 4px; height: 1.5vh; margin-top: 1.25vh; }
  .duo .dbar span { border-radius: 4px; min-width: 4px; }
  .et.price { margin-top: 1.5vh; }
  .pr { display: flex; align-items: center; gap: 2.4vw; margin-top: .75vh; }
  .pr b { font: 300 6vh/1.1 Inter; white-space: nowrap; }
  .pbar { position: relative; flex: 1; height: 7vh; }
  .pbar .pg { position: absolute; left: 0; right: 0; top: 1vh; height: 1.5vh; border-radius: 99px; background: linear-gradient(90deg, #f87171, #facc15 45%, #34d399); opacity: .85; }
  .pbar .pm { position: absolute; top: 0; width: 4px; height: 3.5vh; margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.7); }
  .pbar small { position: absolute; bottom: 0; font: 400 1.9vh Inter; color: #94a3b8; }

  /* okná a dvere, predpoveď, energia */
  .wl { margin-top: 2.5vh; display: flex; flex-direction: column; gap: 1.25vh; max-height: 62vh; overflow: auto; }
  .wr { display: flex; align-items: center; gap: 1.4vw; padding: 2.25vh 1.75vw; border-radius: 20px; background: rgba(96,165,250,.1); }
  .wr.dr { background: rgba(251,146,60,.1); } .wr.ok { background: rgba(52,211,153,.1); }
  .wr .ic { font-size: 4vh; color: #60a5fa; } .wr.dr .ic { color: #fb923c; } .wr.ok .ic { color: #34d399; }
  .wr .wn { flex: 1; min-width: 0; } .wr .wn b { font: 500 3vh Inter; display: block; } .wr .wn small { font: 400 2.1vh Inter; color: #94a3b8; }
  .wr .warn { color: #fca5a5; } .wr .wd { font: 300 3.75vh Inter; color: #cbd5e1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .li { display: flex; align-items: center; gap: 1.25vw; padding: 1.6vh 0; font: 300 3vh Inter; border-top: 1px solid rgba(255,255,255,.06); }
  .li:first-child { border-top: 0; } .li svg { width: 3.5vh; height: 3.5vh; flex: none; }
  .li .grow { flex: 1; } .li .dim { color: #94a3b8; font-size: .8em; } .li .rain { color: #60a5fa; font-size: .8em; min-width: 8vw; text-align: right; }
  .li .tmp small { color: #94a3b8; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2.75vh 3.1vw; margin-top: 2.5vh; }
  .kv .k { font: 500 1.75vh Inter; color: #94a3b8; letter-spacing: .1em; text-transform: uppercase; }
  .kv .v { font: 300 4.75vh Inter; font-variant-numeric: tabular-nums; margin-top: .5vh; } .kv .v small { font-size: .5em; color: #94a3b8; margin-left: .2em; }
  .kv .x { font: 400 2vh Inter; color: #94a3b8; margin-top: .25vh; }
  .note { font: 400 2.25vh/1.5 Inter; color: #94a3b8; margin-top: 3.25vh; padding-top: 2.5vh; border-top: 1px solid rgba(255,255,255,.06); }
  .note b { color: var(--text); font-weight: 500; }

  /* ---------- Kamera, výstraha, ostatné ---------- */
  .camfull { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: #000; z-index: 35; display: none; }
  .camfull.show { display: block; } .camfull img { width: 100%; height: 100%; object-fit: contain; }
  .camfull .x { position: absolute; top: 3vh; right: 3vw; font: 400 2.4vh Inter; padding: 1.25vh 1.9vw; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; }
  .alert { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: none; align-items: center; justify-content: center;
    background: radial-gradient(circle at center, rgba(220,38,38,.6), rgba(69,10,10,.95)); z-index: 40; }
  .alert.show { display: flex; } .alert-inner { text-align: center; } .alert-inner svg { width: 18vh; height: 18vh; color: #fff; }
  .alert-text { font: 600 9vh Inter; margin-top: 2vh; } .alert-sub { font: 400 3.25vh Inter; color: rgba(255,255,255,.8); margin-top: 1.25vh; }
  .night { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity 2s; z-index: 30; }
  body.dim .night { opacity: 1; }
  .toast { position: fixed; left: 50%; bottom: 4vh; transform: translate(-50%, 20px); opacity: 0; padding: 1.5vh 2.3vw; border-radius: 999px;
    background: #1e293b; font: 400 2.4vh Inter; transition: opacity .3s, transform .3s; z-index: 45; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .demo { position: fixed; top: .8vh; left: 50%; transform: translateX(-50%); font: 500 1.4vh Inter; color: var(--faint); letter-spacing: .2em; display: none; z-index: 5; }
  body.is-demo .demo { display: block; }
  .offline { position: fixed; top: 1.2vh; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: .6vw; z-index: 6;
    padding: .8vh 1.25vw; border-radius: 99px; background: rgba(127,29,29,.85); color: #fecaca; font: 400 2vh Inter; }
  .offline i { width: 1vh; height: 1vh; border-radius: 50%; background: #f87171; }
  body.stale .offline { display: flex; }
  .diag { position: fixed; bottom: 1vh; left: 50%; transform: translateX(-50%); display: none; z-index: 6; max-width: 80vw; padding: .75vh 1.25vw; border-radius: 99px;
    background: rgba(120,53,15,.85); color: #fde68a; font: 400 1.75vh Inter; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .diag.show { display: block; }
  .dgp { position: fixed; left: 2vw; top: 2vh; z-index: 50; display: none; padding: 2vh 1.6vw; border-radius: 14px; background: rgba(8,10,18,.95);
    border: 1px solid rgba(255,255,255,.15); font: 400 1.9vh/1.6 ui-monospace, Menlo, monospace; color: #e5e7eb; white-space: pre; }
  .dgp.show { display: block; }

  /* ---------- Denný kontrast (hc): cez deň hrubšie písmo a jasnejšie sivé ---------- */
  body.hc { --muted: #b4bccb; --faint: #8a95a8; --r: #05080f; }
  body.hc .clk { font-weight: 300; }
  body.hc .date, body.hc .weather, body.hc .row p small, body.hc .room small, body.hc .act small, body.hc .kotol { font-weight: 500; }
  body.hc .row b, body.hc .room b { font-weight: 400; }
  body.hc .seg i { background: rgba(255,255,255,.1); }
</style>
</head>
<body>
<div class="demo">DEMO</div>
<div class="offline"><i></i>Bez spojenia s HA · údaje môžu byť staré</div>
<div class="diag" id="diag"></div>
<div class="dgp" id="dgp"></div>

<div class="app">
  <section class="lp">
    <div id="time"></div>
    <div class="date" id="date"></div>
    <div class="weather" id="weather"></div>
    <div class="cnts" id="cnts"></div>
    <div class="bt">
      <button class="act blinds" id="btnBlinds"></button>
      <button class="act vac" id="btnVac"></button>
      <button class="act" id="btnSec"></button>
      <button class="act cam" id="btnCam"></button>
    </div>
  </section>

  var S = {}, mode = 'demo', ws = null, wsId = 100, token = null, wsCb = {};

  }

  function parentHass() {

  // Strážca spojenia: HA posiela udalosti len pri zmene, preto každých 20 s pošleme ping.

  var wsLast = 0, wsGen = 0, wsRetry = null, wsLastEv = 0;

    if (mode !== 'ws') return;

    var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/websocket';

  // subscribe_entities posiela skomprimované stavy: a = pridané/celé, c = zmeny (+ / −), r = odstránené

      ws.send(JSON.stringify({ id: ++wsId, type: 'call_service', domain: domain, service: service, service_data: data }));
    } else if (mode === 'demo') {
      var ids = [].concat(data.entity_id);
      if (ids.length > 1 || (S[ids[0]] && S[ids[0]].attributes.entity_id)) {
        // skupina / viac entít: aplikuj na všetkých členov
        ids.forEach(function (g) { expand(g).forEach(function (m) {
          if (S[m]) S[m].state = service === 'turn_on' ? 'on' : service === 'turn_off' ? 'off' : (S[m].state === 'on' ? 'off' : 'on');
        }); });
        return;
      }
      var e = S[ids[0]]; if (!e) return;
      if (service === 'toggle') e.state = e.state === 'on' ? 'off' : 'on';
      if (service === 'set_temperature') e.attributes.temperature = data.temperature;
      if (service === 'set_hvac_mode') {
        e.state = data.hvac_mode;
        e.attributes.hvac_action = data.hvac_mode === 'off' ? 'off'

      'light.tablet_led_kurenie': s('on', { rgb_color: [255, 0, 0], brightness: 128 }),
      'light.tablet_led_podlaha': s('off'),
      'light.tablet_led_bateria': s('on', { rgb_color: [255, 213, 0], brightness: 130 }),
      'light.tablet_led_siet': s('on', { rgb_color: [255, 225, 0], brightness: 128 }),
      'light.tablet_led_plyn': s('on', { rgb_color: [255, 255, 0], brightness: 148 }),
      'input_number.tablet_led_jas': s(40, { min: 5, max: 100, step: 5 }), 'input_number.tablet_led_jas_noc': s(10, { min: 5, max: 100, step: 5 }),
      'input_boolean.kuchyna_podlaha_1h': s('on'),
      'climate.kuchyna_podlahove_kurenie': th(23.4, 24, 'heating'),
      'sensor.bateria_stav': s('Charging'), 'sensor.siet_stav': s('Supplying'),
      'sensor.kuchyna_podlahove_kurenie_vykon': s(40),
      'sensor.today_production_inverter_keep': s(18.4), 'sensor.today_load_consumption_inverter_keep': s(14.9),
      'sensor.today_energy_import_inverter_keep': s(6.2), 'sensor.today_energy_import_inverter_keep_cost': s(0.98, { unit_of_measurement: '€' }),
      'sensor.today_energy_export_inverter_keep': s(4.7), 'sensor.today_energy_export_inverter_keep_compensation': s(1.12, { unit_of_measurement: '€' }),
      'sensor.today_battery_charge_inverter_keep': s(12.3), 'sensor.today_battery_discharge_inverter_keep': s(9.8),
      'sensor.solcast_pv_forecast_forecast_remaining_today_keep': s(6.1), 'sensor.solcast_pv_forecast_forecast_tomorrow_keep': s(22.5),
      'sensor.okte_min_cena_dnes': s(4), 'sensor.okte_max_cena_dnes': s(271)
    };
  }
  function demoForecast() {
    var c = ['partlycloudy', 'rainy', 'cloudy', 'sunny', 'sunny', 'partlycloudy'], hi = [15, 11, 12, 16, 18, 14], lo = [7, 6, 5, 6, 8, 7];
    FC = c.map(function (x, i) {
      return { datetime: new Date(Date.now() + i * 86400000).toISOString(), condition: x,
        temperature: hi[i], templow: lo[i], precipitation: x === 'rainy' ? 3.4 : 0 };
    });
  }

  /* ================= Štart ================= */
  function ago(t) { if (!t) return '–'; var s = Math.round((Date.now() - t) / 1000); return s < 120 ? s + ' s' : Math.round(s / 60) + ' min'; }
  function renderDiag() {
    var el = $('dgp'); if (!el.classList.contains('show')) return;
    var rs = ws ? ['pripája sa', 'otvorené', 'zatvára sa', 'zatvorené'][ws.readyState] : 'žiadne';
    el.textContent = 'Verzia      ' + VERSION + '\nRežim       ' + mode + '\nSpojenie    ' + rs + ' · pripojení ' + DIAG.conn + ' · posledné pred ' + ago(DIAG.at) +
      (DIAG.why ? '\nDôvod       ' + DIAG.why : '') + '\nOdber       ' + (DIAG.sub || '–') +
      '\nZmeny       ' + DIAG.evN + ' · posledná pred ' + ago(wsLastEv) + '\n            ' + (DIAG.evId || '') +
      '\nOdpoveď     pred ' + ago(wsLast) + '\nEntít       ' + Object.keys(S).length + ' · svetiel zapnutých ' + lightsOn().length +
      '\nAktualizácia ' + (DIAG.upd ? DIAG.upd.msg + ' (pred ' + ago(DIAG.upd.t) + ')' : '–') +
      '\nChyba       ' + (DIAG.err ? DIAG.err.msg + ' (pred ' + ago(DIAG.err.t) + ')' : '–') + '\n\nťuknutím zavrieť';
  }
  function tick() {
    try { renderDiag(); } catch (e) {}
    try { render(); } catch (e) { rErr('render', e); }
    try { renderButtons(); } catch (e) { rErr('tlačidlá', e); }
    try {
      var showErr = DIAG.err && Date.now() - DIAG.err.t < 120000;
      var d = $('diag'); setC(d, 'diag' + (showErr ? ' show' : ''));
      if (showErr) setHTML(d, '⚠ ' + esc(DIAG.err.msg));
    } catch (e) {}
  }

  function start() {
    var hass = parentHass();
    var m = (location.hash + '&' + location.search).match(/token=([^&#]+)/), saved = null;
    try { saved = localStorage.getItem('wall_token'); } catch (e) {}
    if (m) { token = decodeURIComponent(m[1]); try { localStorage.setItem('wall_token', token); } catch (e) {} }
    else token = saved;
    if (hass) {
      mode = 'parent'; S = hass.states;
      setInterval(function () { var h = parentHass(); if (h) S = h.states; }, 1000);
    } else if (token) {
      mode = 'ws'; connectWS();
    } else {
      mode = 'demo'; S = demo(); demoForecast();
      setInterval(function () { S[E.motion].state = on(E.motion) ? 'off' : 'on'; }, 8000);
    }

    press($('btnBlinds'), function () { blinds('up'); }, function () { blinds('down'); });
    press($('btnVac'), function () { vacuum(false); }, function () { vacuum(true); });
    press($('btnSec'), function () {
      var arm = on(E.security);
      call('input_boolean', 'toggle', { entity_id: E.security });
      toast(arm ? 'Stráženie prístrešku vypnuté' : 'Prístrešok stráži');
      setTimeout(tick, 300);
    });
    press($('btnCam'), openCamFull);
    press($('camfull'), closeCamFull);
    press($('time'), function () {}, function () { $('dgp').classList.add('show'); renderDiag(); });
    $('dgp').addEventListener('click', function () { this.classList.remove('show'); });

    $('weather').addEventListener('click', function () { fetchForecast(); openSheet('forecast'); });
    $('rows').addEventListener('click', function () { openSheet('energy'); });
    $('cnts').addEventListener('click', function (e) {
      var el = e.target; while (el && el !== this && !el.getAttribute('data-open')) el = el.parentNode;
      if (el && el !== this) openSheet(el.getAttribute('data-open'));
    });
    $('heat').addEventListener('click', function (e) {
      var el = e.target; while (el && el !== this && el.getAttribute('data-room') == null) el = el.parentNode;
      if (el && el !== this) openSheet('heat', +el.getAttribute('data-room'));
    });
    $('sheet').addEventListener('click', function (e) { if (e.target === this) closeSheet(); });

    // akcie v kartách
    $('card').addEventListener('click', function (e) {
      var el = e.target; while (el && el !== this && !el.getAttribute('data-act')) el = el.parentNode;
      if (!sheetType) return;
      if (sheetType !== 'heat') closeIn(sheetType === 'lights' ? CLOSE_IDLE : CLOSE_INFO);
      if (!el || el === this) return;
      var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
      if (sheetType === 'heat') {
        var rid = E.rooms[sheetArg][0];
        if (act === 'plus' || act === 'minus') { if (st(rid) !== 'off') setTarget(rid, targetOf(rid) + (act === 'plus' ? 0.5 : -0.5)); }
        else if (act === 'h1h') {
          var was = on(E.floor1h);
          call('input_boolean', 'toggle', { entity_id: E.floor1h });
          toast(was ? 'Podlahové kúrenie 1 h zrušené' : 'Podlahové kúrenie na 1 hodinu');
          closeIn(CLOSE_AFTER_SET); setTimeout(renderSheet, 300);
        }
        return;
      }
      if (sheetType === 'lights') {
        e.stopPropagation();
        if (act === 'alloff') { call('light', 'turn_off', { entity_id: lightsOn() }); toast('Všetky svetlá zhasnuté'); }
        else if (act === 'roomtg') roomToggle(id);
        else if (act === 'room') lightRoom = id;
        else if (act === 'back') lightRoom = null;
        else if (act === 'light') call('light', 'toggle', { entity_id: id });
        renderSheet(); setTimeout(tick, 250);
      }
    });

    if (mode !== 'ws') fetchForecast();
    setInterval(fetchForecast, FORECAST_REFRESH);

    // Automatická aktualizácia: keď na serveri nahráš novú verziu súboru,
    // stránka si ju do minúty sama načíta (obíde cache prehliadača)
    function checkUpdate() {
      if (!window.fetch || location.protocol === 'file:') return;
      fetch(location.pathname + '?check=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { DIAG.upd = { t: Date.now(), msg: 'HTTP ' + r.status }; return r.ok ? r.text() : null; })
        .then(function (t) {
          var m = t && t.match(/var VERSION = '([^']+)'/);
          DIAG.upd = { t: Date.now(), msg: m ? 'na serveri ' + m[1] + (m[1] === VERSION ? ' (rovnaká)' : ' → obnovujem') : 'verzia v súbore nenájdená' };
          if (m && m[1] !== VERSION) {
            // ponechaj ostatné parametre adresy (napr. token), vymeň len číslo verzie
            var keep = location.search.replace(/^\?/, '').split('&').filter(function (p) {
              return p && p.indexOf('v=') !== 0 && p.indexOf('check=') !== 0; }).join('&');
            location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]) + (keep ? '&' + keep : '') + location.hash);
          }
        })
        .catch(function (e) { DIAG.upd = { t: Date.now(), msg: 'chyba: ' + (e && e.message ? e.message : e) }; });
    }
    checkUpdate(); setInterval(checkUpdate, 60000);
    // poistka proti dlhodobému zamrznutiu prehliadača: raz denne o 3:30 celé obnovenie stránky
    setInterval(function () { var d = new Date(); if (mode === 'ws' && d.getHours() === 3 && d.getMinutes() === 30) location.replace(location.pathname + '?v=' + Date.now() + location.hash); }, 60000);

    document.addEventListener('pointerdown', function () { wakeUntil = Date.now() + WAKE_MS; }, true);
    tick(); setInterval(tick, 1000);
    // náhľad kariet: ?sheet=heat:0 / lights / windows / forecast / energy
    var q = location.search.match(/sheet=([a-z]+)(?::(\d+))?/);
    if (q) setTimeout(function () { openSheet(q[1], q[2] != null ? +q[2] : undefined); clearTimeout(closeT); }, 300);
  }
  start();
})();
</script>
</body>
</html>
