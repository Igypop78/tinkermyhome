<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" role="img" aria-label="How Pattern Pilot works"><text x="40" y="44" font-size="21" fill="#8E8E93" font-weight="700">How Pattern Pilot works</text><rect x="40" y="80" width="280" height="150" rx="18" fill="#0A84FF" fill-opacity="0.10" stroke="#0A84FF" stroke-width="2"/><circle cx="76" cy="118" r="18" fill="#0A84FF"/><text x="76" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text><text x="106" y="125" font-size="22" font-weight="700" fill="#0A84FF">Collect</text><text x="60" y="174" font-size="18" fill="#6E6E73">every change in the house</text><text x="60" y="202" font-size="18" fill="#6E6E73">+ who caused it</text><path d="M326 155.0 h28 m-10 -8 l10 8 l-10 8" fill="none" stroke="#8E8E93" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="80" width="280" height="150" rx="18" fill="#30B0C7" fill-opacity="0.10" stroke="#30B0C7" stroke-width="2"/><circle cx="396" cy="118" r="18" fill="#30B0C7"/><text x="396" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text><text x="426" y="125" font-size="22" font-weight="700" fill="#30B0C7">Events</text><text x="380" y="174" font-size="18" fill="#6E6E73">“shower”, “kettle”,</text><text x="380" y="202" font-size="18" fill="#6E6E73">“water started flowing”</text><path d="M646 155.0 h28 m-10 -8 l10 8 l-10 8" fill="none" stroke="#8E8E93" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="680" y="80" width="280" height="150" rx="18" fill="#34C759" fill-opacity="0.10" stroke="#34C759" stroke-width="2"/><circle cx="716" cy="118" r="18" fill="#34C759"/><text x="716" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text><text x="746" y="125" font-size="22" font-weight="700" fill="#34C759">Context</text><text x="700" y="174" font-size="18" fill="#6E6E73">day type, dark, weather,</text><text x="700" y="202" font-size="18" fill="#6E6E73">how many people are home</text><rect x="40" y="270" width="280" height="150" rx="18" fill="#FF9F0A" fill-opacity="0.10" stroke="#FF9F0A" stroke-width="2"/><circle cx="76" cy="308" r="18" fill="#FF9F0A"/><text x="76" y="314" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">4</text><text x="106" y="315" font-size="22" font-weight="700" fill="#FF9F0A">Nightly analysis</text><text x="60" y="364" font-size="18" fill="#6E6E73">looks for patterns</text><text x="60" y="392" font-size="18" fill="#6E6E73">120 days, outside recorder</text><path d="M326 345.0 h28 m-10 -8 l10 8 l-10 8" fill="none" stroke="#8E8E93" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="360" y="270" width="280" height="150" rx="18" fill="#AF52DE" fill-opacity="0.10" stroke="#AF52DE" stroke-width="2"/><circle cx="396" cy="308" r="18" fill="#AF52DE"/><text x="396" y="314" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">5</text><text x="426" y="315" font-size="22" font-weight="700" fill="#AF52DE">Backtest</text><text x="380" y="364" font-size="18" fill="#6E6E73">how often it would hit</text><text x="380" y="392" font-size="18" fill="#6E6E73">and how often it misfires</text><path d="M646 345.0 h28 m-10 -8 l10 8 l-10 8" fill="none" stroke="#8E8E93" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="680" y="270" width="280" height="150" rx="18" fill="#C2410C" fill-opacity="0.10" stroke="#C2410C" stroke-width="2"/><circle cx="716" cy="308" r="18" fill="#C2410C"/><text x="716" y="314" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">6</text><text x="746" y="315" font-size="22" font-weight="700" fill="#C2410C">You decide</text><text x="700" y="364" font-size="18" fill="#6E6E73">Accept · Edit ·</text><text x="700" y="392" font-size="18" fill="#6E6E73">Not now · Never</text><path d="M820 230 v14 H180 v20 m-8 -10 l8 10 l8 -10" fill="none" stroke="#8E8E93" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="452" text-anchor="middle" font-size="18" font-weight="600" fill="#C2410C">It never acts on its own. An automation exists only after you click.</text></svg>