<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" role="img" aria-label="Zapojenie: SmartShunt → ESP32-S3 → Deye">
<text x="40" y="44" font-size="21" fill="#8E8E93" font-weight="700">Zapojenie: SmartShunt → ESP32-S3 → Deye</text>
<!-- battery + shunt -->
<rect x="40" y="90" width="230" height="110" rx="18" fill="#8E8E93" fill-opacity=".10" stroke="#8E8E93" stroke-width="2"/>
<text x="155" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#8E8E93">Batéria</text>
<text x="155" y="160" text-anchor="middle" font-size="16" fill="#6E6E73">LiFePO4 48 V</text>
<text x="80" y="188" font-size="20" font-weight="700" fill="#FF3B30">+</text><text x="222" y="188" font-size="22" font-weight="700" fill="#6E6E73">−</text>
<path d="M228 200 V260" stroke="#6E6E73" stroke-width="3"/>
<rect x="40" y="260" width="230" height="130" rx="18" fill="#0A84FF" fill-opacity=".10" stroke="#0A84FF" stroke-width="2"/>
<text x="155" y="298" text-anchor="middle" font-size="22" font-weight="700" fill="#0A84FF">Victron SmartShunt</text>
<text x="155" y="326" text-anchor="middle" font-size="16" fill="#6E6E73">↑ mínus batérie</text>
<text x="155" y="350" text-anchor="middle" font-size="16" fill="#6E6E73">↓ mínus systému</text>
<path d="M155 390 V430" stroke="#6E6E73" stroke-width="3"/><text x="155" y="452" text-anchor="middle" font-size="15" fill="#6E6E73">→ k meniču</text>
<!-- BT -->
<path d="M275 325 C 320 325, 330 300, 380 300" fill="none" stroke="#0A84FF" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
<text x="327" y="268" text-anchor="middle" font-size="17" font-weight="700" fill="#0A84FF">Bluetooth</text>
<!-- ESP -->
<rect x="385" y="200" width="240" height="210" rx="18" fill="#30B0C7" fill-opacity=".10" stroke="#30B0C7" stroke-width="2"/>
<text x="505" y="240" text-anchor="middle" font-size="21" font-weight="700" fill="#30B0C7">Waveshare</text>
<text x="505" y="266" text-anchor="middle" font-size="17" font-weight="600" fill="#30B0C7">ESP32-S3-RS485-CAN</text>
<text x="505" y="300" text-anchor="middle" font-size="15" fill="#6E6E73">ESPHome · Pylontech</text>
<text x="505" y="322" text-anchor="middle" font-size="14" fill="#6E6E73">TX GPIO15 · RX GPIO16 · 500 kbps</text>
<text x="505" y="395" text-anchor="middle" font-size="14" fill="#6E6E73">jumper 120 Ω zapnutý</text>
<!-- ESP terminals -->
<g font-size="15" font-weight="700">
<rect x="398" y="340" width="96" height="34" rx="8" fill="none" stroke="#30B0C7" stroke-width="1.5"/><text x="446" y="362" text-anchor="middle" fill="#6E6E73">DC 7–36 V</text>

</g>
<!-- ESP terminal dots -->
<circle cx="625" cy="345" r="6" fill="#0A84FF"/><text x="606" y="350" text-anchor="end" font-size="16" font-weight="700" fill="#0A84FF">H</text>
<circle cx="625" cy="372" r="6" fill="#fff" stroke="#0A84FF" stroke-width="2.5"/><text x="606" y="377" text-anchor="end" font-size="16" font-weight="700" fill="#0A84FF">L</text>
<text x="606" y="236" text-anchor="end" font-size="0"> </text>
<circle cx="440" cy="410" r="6" fill="#FF3B30"/><text x="440" y="433" text-anchor="middle" font-size="16" font-weight="700" fill="#FF3B30">+</text>
<circle cx="470" cy="410" r="6" fill="#6E6E73"/><text x="470" y="433" text-anchor="middle" font-size="16" font-weight="700" fill="#6E6E73">−</text>
<!-- Deye -->
<rect x="760" y="90" width="200" height="420" rx="18" fill="#FF9500" fill-opacity=".10" stroke="#FF9500" stroke-width="2"/>
<text x="860" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#FF9500">Deye</text>
<text x="860" y="156" text-anchor="middle" font-size="14" fill="#6E6E73">SUN-10K-SG04LP3-EU</text>
<text x="860" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#6E6E73">port BMS (RJ45)</text>
<rect x="790" y="225" width="12" height="40" rx="3" fill="none" stroke="#8E8E93" stroke-width="2"/><text x="796" y="282" text-anchor="middle" font-size="12" fill="#6E6E73">1</text><rect x="808" y="225" width="12" height="40" rx="3" fill="none" stroke="#8E8E93" stroke-width="2"/><text x="814" y="282" text-anchor="middle" font-size="12" fill="#6E6E73">2</text><rect x="826" y="225" width="12" height="40" rx="3" fill="none" stroke="#8E8E93" stroke-width="2"/><text x="832" y="282" text-anchor="middle" font-size="12" fill="#6E6E73">3</text><rect x="844" y="225" width="12" height="40" rx="3" fill="#0A84FF" stroke="#0A84FF" stroke-width="2"/><text x="850" y="282" text-anchor="middle" font-size="12" fill="#6E6E73">4</text><rect x="862" y="225" width="12" height="40" rx="3" fill="#fff" stroke="#0A84FF" stroke-width="2"/><text x="868" y="282" text-anchor="middle" font-size="12" fill="#6E6E73">5</text><rect x="880" y="225" width="12" height="40" rx="3" fill="none" stroke="#8E8E93" stroke-width="2"/><text x="886" y="282" text-anchor="middle" font-size="12" fill="#6E6E73">6</text><rect x="898" y="225" width="12" height="40" rx="3" fill="none" stroke="#8E8E93" stroke-width="2"/><text x="904" y="282" text-anchor="middle" font-size="12" fill="#6E6E73">7</text><rect x="916" y="225" width="12" height="40" rx="3" fill="none" stroke="#8E8E93" stroke-width="2"/><text x="922" y="282" text-anchor="middle" font-size="12" fill="#6E6E73">8</text><text x="860" y="304" text-anchor="middle" font-size="13" fill="#6E6E73">ostatné piny nezapojené</text>
<text x="860" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#6E6E73">výstup 12 V</text>
<circle cx="835" cy="465" r="7" fill="#FF3B30"/><text x="835" y="494" text-anchor="middle" font-size="16" font-weight="700" fill="#FF3B30">+</text>
<circle cx="885" cy="465" r="7" fill="#6E6E73"/><text x="885" y="494" text-anchor="middle" font-size="16" font-weight="700" fill="#6E6E73">−</text>
<!-- CAN wires -->
<path d="M631 345 H700 V245 H844" fill="none" stroke="#0A84FF" stroke-width="3" stroke-linejoin="round"/>
<path d="M631 372 H720 V258 H862" fill="none" stroke="#0A84FF" stroke-width="3" stroke-dasharray="9 5" stroke-linejoin="round"/>
<circle cx="844" cy="245" r="4" fill="#0A84FF"/><circle cx="862" cy="258" r="4" fill="#0A84FF"/>
<text x="860" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#0A84FF">4 modrý → H</text>
<text x="860" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#0A84FF">5 bielo-modrý → L</text>
<!-- power wires -->
<path d="M440 416 V520 H835 V472" fill="none" stroke="#FF3B30" stroke-width="3" stroke-linejoin="round"/>
<path d="M470 416 V505 H885 V472" fill="none" stroke="#6E6E73" stroke-width="3" stroke-linejoin="round"/>
<text x="40" y="545" font-size="15" fill="#6E6E73">Kábel T568B, zapojené len piny 4 a 5. Deye: batéria Lithium, protokol 00.</text>
</svg>