<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 535" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" role="img" aria-label="Where the sensors go – without touching the meter">
<text x="40" y="44" font-size="21" fill="#8E8E93" font-weight="700">Where the sensors go – without touching the meter</text>
<text x="40" y="86" font-size="16" fill="#0A84FF" font-weight="700">Water meter (side view)</text>
<rect x="70" y="250" width="300" height="90" rx="20" fill="#0A84FF" fill-opacity=".10" stroke="#0A84FF" stroke-width="2"/>
<rect x="40" y="275" width="30" height="40" rx="6" fill="#8E8E93" fill-opacity=".25"/><rect x="370" y="275" width="30" height="40" rx="6" fill="#8E8E93" fill-opacity=".25"/>
<rect x="90" y="215" width="260" height="35" rx="6" fill="#C9A227" fill-opacity=".25" stroke="#C9A227" stroke-width="2"/>
<path d="M100 212 H 340" stroke="#30B0C7" stroke-width="5" stroke-linecap="round"/>
<text x="352" y="207" font-size="13" fill="#30B0C7" font-weight="700">glass</text>
<ellipse cx="220" cy="232" rx="34" ry="9" fill="#8E8E93" fill-opacity=".25" stroke="#8E8E93" stroke-width="1.5"/>
<path d="M186 232 A34 9 0 0 0 254 232 Z" fill="#8E8E93" fill-opacity=".85"/>
<path d="M220 240 V 380" stroke="#6E6E73" stroke-width="1" stroke-dasharray="3 4"/>
<text x="220" y="398" font-size="13" fill="#6E6E73" font-weight="600" text-anchor="middle">wheel with a metal plate</text>
<rect x="200" y="110" width="40" height="100" rx="4" fill="#8E8E93" fill-opacity=".45" stroke="#6E6E73" stroke-width="1.5"/>
<rect x="196" y="140" width="48" height="10" rx="2" fill="#6E6E73" fill-opacity=".6"/>
<rect x="203" y="196" width="34" height="14" rx="3" fill="#30B0C7"/>
<circle cx="220" cy="125" r="5" fill="#FF3B30"/>
<path d="M220 110 C 220 90, 250 80, 270 80" fill="none" stroke="#6E6E73" stroke-width="3"/>
<text x="250" y="129" font-size="12" fill="#FF3B30" font-weight="700">LED</text>
<text x="192" y="186" font-size="13" fill="#6E6E73" font-weight="600" text-anchor="end">inductive sensor</text>
<path d="M196 145 H 25 V 360 H 120" fill="none" stroke="#FF9500" stroke-width="3" stroke-dasharray="8 5"/>
<path d="M244 145 H 415 V 360 H 320" fill="none" stroke="#FF9500" stroke-width="3" stroke-dasharray="8 5"/>
<text x="408" y="168" font-size="13" fill="#FF9500" font-weight="700" text-anchor="end">holder (3D print / bracket)</text>
<text x="40" y="440" font-size="15" fill="#6E6E73" font-weight="600">The sensor touches the glass</text>
<text x="40" y="462" font-size="15" fill="#6E6E73" font-weight="600">right above the wheel.</text>
<text x="40" y="490" font-size="15" fill="#6E6E73" font-weight="600">Metal under the sensor = LED on,</text>
<text x="40" y="512" font-size="15" fill="#6E6E73" font-weight="600">water running = LED blinks.</text>
<text x="540" y="86" font-size="16" fill="#34C759" font-weight="700">Gas meter (front)</text>
<rect x="560" y="110" width="400" height="280" rx="16" fill="#8E8E93" fill-opacity=".10" stroke="#8E8E93" stroke-width="2"/>
<rect x="580" y="140" width="370" height="46" rx="6" fill="#1C1C1E"/>
<text x="615" y="172" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">0</text>
<text x="651" y="172" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="687" y="172" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="723" y="172" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="759" y="172" font-size="24" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="792" y="172" font-size="24" fill="#FFFFFF" font-weight="700">,</text>
<text x="820" y="172" font-size="24" fill="#FF6961" font-weight="700" text-anchor="middle">9</text>
<text x="854" y="172" font-size="24" fill="#FF6961" font-weight="700" text-anchor="middle">7</text>
<rect x="870" y="143" width="34" height="40" rx="4" fill="none" stroke="#34C759" stroke-width="3"/>
<text x="887" y="172" font-size="24" fill="#FF6961" font-weight="700" text-anchor="middle">0</text>
<text x="912" y="174" font-size="14" fill="#FFFFFF" font-weight="700">m³</text>
<path d="M887 186 V 230" stroke="#34C759" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="875" y="210" font-size="13" fill="#34C759" font-weight="700" text-anchor="end">last wheel with a magnet</text>
<rect x="840" y="230" width="94" height="70" rx="8" fill="#8E8E93" fill-opacity=".22" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="832" y="270" font-size="13" fill="#6E6E73" font-weight="600" text-anchor="end">recess for a sensor</text>
<rect x="880" y="238" width="14" height="54" rx="7" fill="#34C759" fill-opacity=".35" stroke="#34C759" stroke-width="2"/>
<path d="M887 292 V 350 H 970" fill="none" stroke="#34C759" stroke-width="2.5"/>
<rect x="852" y="258" width="70" height="14" rx="7" fill="none" stroke="#6E6E73" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="580" y="330" font-size="14" fill="#34C759" font-weight="700">✓ best for me: perpendicular</text>
<text x="580" y="352" font-size="13" fill="#6E6E73" font-weight="600">– horizontal – worse for me</text>
<text x="580" y="296" font-size="15" fill="#34C759" font-weight="700">1 turn = 0.01 m³</text>
<text x="540" y="440" font-size="15" fill="#6E6E73" font-weight="600">Only the glass reed tube goes into</text>
<text x="540" y="462" font-size="15" fill="#6E6E73" font-weight="600">the recess on an extended wire;</text>
<text x="540" y="484" font-size="15" fill="#6E6E73" font-weight="600">the module board sits behind the meter.</text>
</svg>
