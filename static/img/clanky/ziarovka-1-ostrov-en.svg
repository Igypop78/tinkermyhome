="0.6"/><path d="M792 233 q8 -9 16 0 M796 238 q4 -4 8 0" fill="none" stroke="#8E8E93" stroke-width="2.4" stroke-linecap="round"/><circle cx="800" cy="243" r="2.4" fill="#8E8E93"/><text x="800" y="299" text-anchor="middle" font-size="16" fill="#8E8E93">Smart bulb</text><text x="800" y="319" text-anchor="middle" font-size="13.5" fill="#FF453A" font-weight="600">no power</text><rect x="536" y="97" width="48" height="76" rx="14" fill="#8E8E93" fill-opacity="0.10" stroke="#8E8E93" stroke-width="2"/><circle cx="560" cy="129" r="12" fill="none" stroke="#8E8E93" stroke-width="2"/><circle cx="560" cy="129" r="3" fill="#8E8E93"/><rect x="552" y="151" width="16" height="6" rx="3" fill="#8E8E93" fill-opacity="0.6"/><text x="560" y="195" text-anchor="middle" font-size="16" fill="#8E8E93">Remote</text><line x1="586" y1="135" x2="770" y2="219" stroke="#0A84FF" stroke-width="2.5" stroke-dasharray="7 6" stroke-linecap="round"/><circle cx="678.0" cy="177.0" r="15" fill="#FF453A"/><path d="M672.0 171.0 L684.0 183.0 M684.0 171.0 L672.0 183.0" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="51" cy="422" r="11" fill="#FF453A"/><text x="51" y="427.5" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">✕</text><text x="70" y="428" text-anchor="start" font-size="17" fill="#8E8E93">The switch cuts power – the</text><text x="70" y="450" text-anchor="start" font-size="17" fill="#8E8E93">remote stops working</text><circle cx="371" cy="422" r="11" fill="#FF453A"/><text x="371" y="427.5" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">✕</text><text x="390" y="428" text-anchor="start" font-size="17" fill="#8E8E93">An island: not connected to</text><text x="390" y="450" text-anchor="start" font-size="17" fill="#8E8E93">anything else</text><circle cx="691" cy="422" r="11" fill="#30D158"/><text x="691" y="427.5" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">✓</text><text x="710" y="428" text-anchor="start" font-size="17" fill="#8E