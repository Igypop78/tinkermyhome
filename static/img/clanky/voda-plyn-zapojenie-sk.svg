<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 693" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" role="img" aria-label="Zapojenie snímačov k ESP32">
<text x="40" y="44" font-size="21" fill="#8E8E93" font-weight="700">Zapojenie snímačov k ESP32</text>
<text x="40" y="86" font-size="16" fill="#0A84FF" font-weight="700">Voda – indukčný snímač cez logický konvertor</text>
<rect x="40" y="115" width="170" height="160" rx="18" fill="#0A84FF" fill-opacity="0.06" stroke="#0A84FF" stroke-width="2"/>
<text x="125" y="162" font-size="16" fill="#0A84FF" font-weight="700" text-anchor="middle">Indukčný snímač</text>
<text x="125" y="186" font-size="13" fill="#6E6E73" text-anchor="middle">NPN · 5 V</text>
<rect x="92" y="215" width="56" height="20" rx="4" fill="#8E8E93" fill-opacity=".35"/><rect x="148" y="218" width="12" height="14" rx="3" fill="#30B0C7"/>
<rect x="400" y="115" width="190" height="160" rx="18" fill="#FF9500" fill-opacity="0.08" stroke="#FF9500" stroke-width="2"/>
<text x="495" y="142" font-size="15" fill="#FF9500" font-weight="700" text-anchor="middle">Logický konvertor</text>
<circle cx="400" cy="170" r="5" fill="#FF3B30"/><text x="410" y="175" font-size="14" fill="#FF3B30" font-weight="700" text-anchor="start">HV</text>
<circle cx="400" cy="210" r="5" fill="#0A84FF"/><text x="410" y="215" font-size="14" fill="#0A84FF" font-weight="700" text-anchor="start">HV</text>
<circle cx="400" cy="250" r="5" fill="#8E8E93"/><text x="410" y="255" font-size="14" fill="#8E8E93" font-weight="700" text-anchor="start">GND</text>
<circle cx="590" cy="170" r="5" fill="#FF9500"/><text x="580" y="175" font-size="14" fill="#FF9500" font-weight="700" text-anchor="end">LV</text>
<circle cx="590" cy="210" r="5" fill="#0A84FF"/><text x="580" y="215" font-size="14" fill="#0A84FF" font-weight="700" text-anchor="end">LV</text>
<circle cx="590" cy="250" r="5" fill="#8E8E93"/><text x="580" y="255" font-size="14" fill="#8E8E93" font-weight="700" text-anchor="end">GND</text>
<rect x="760" y="115" width="200" height="170" rx="18" fill="#30B0C7" fill-opacity="0.1" stroke="#30B0C7" stroke-width="2"/>
<text x="860" y="106" font-size="16" fill="#30B0C7" font-weight="700" text-anchor="middle">ESP32 DevKit</text>
<circle cx="760" cy="140" r="5" fill="#FF3B30"/><text x="770" y="145" font-size="14" fill="#FF3B30" font-weight="700" text-anchor="start">5V (VIN)</text>
<circle cx="760" cy="180" r="5" fill="#FF9500"/><text x="770" y="185" font-size="14" fill="#FF9500" font-weight="700" text-anchor="start">3V3</text>
<circle cx="760" cy="220" r="5" fill="#0A84FF"/><text x="770" y="225" font-size="14" fill="#0A84FF" font-weight="700" text-anchor="start">GPIO27</text>
<circle cx="760" cy="260" r="5" fill="#8E8E93"/><text x="770" y="265" font-size="14" fill="#8E8E93" font-weight="700" text-anchor="start">GND</text>
<path d="M210 170 H 400" fill="none" stroke="#FF3B30" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M210 210 H 400" fill="none" stroke="#0A84FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 5"/>
<path d="M210 250 H 400" fill="none" stroke="#8E8E93" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="218" y="162" font-size="12" fill="#A2845E" font-weight="700">hnedý +</text>
<text x="218" y="202" font-size="12" fill="#6E6E73" font-weight="700">čierny = signál</text>
<text x="218" y="242" font-size="12" fill="#6E6E73" font-weight="700">modrý −</text>
<text x="330" y="230" font-size="12" fill="#0A84FF" font-weight="600">5 V</text>
<path d="M760 140 H 700 V 96 H 350 V 170" fill="none" stroke="#FF3B30" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="350" cy="170" r="5" fill="#FF3B30"/>
<path d="M590 170 H 680 V 180 H 760" fill="none" stroke="#FF9500" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M590 210 H 680 V 220 H 760" fill="none" stroke="#0A84FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M590 250 H 680 V 260 H 760" fill="none" stroke="#8E8E93" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="612" y="232" font-size="12" fill="#0A84FF" font-weight="600">3,3 V</text>
<rect x="810" y="305" width="100" height="36" rx="10" fill="#FF3B30" fill-opacity="0.06" stroke="#FF3B30" stroke-width="2"/>
<text x="860" y="329" font-size="13" fill="#FF3B30" font-weight="700" text-anchor="middle">USB 5 V</text>
<path d="M860 285 V 305" fill="none" stroke="#FF3B30" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="40" y="406" font-size="16" fill="#34C759" font-weight="700">Plyn – reed modul priamo</text>
<rect x="40" y="430" width="200" height="125" rx="18" fill="#34C759" fill-opacity="0.06" stroke="#34C759" stroke-width="2"/>
<text x="130" y="485" font-size="16" fill="#34C759" font-weight="700" text-anchor="middle">Reed modul</text>
<text x="130" y="509" font-size="13" fill="#6E6E73" text-anchor="middle">napájaný 3,3 V</text>
<circle cx="240" cy="460" r="5" fill="#FF9500"/><text x="230" y="465" font-size="14" fill="#FF9500" font-weight="700" text-anchor="end">+</text>
<circle cx="240" cy="495" r="5" fill="#8E8E93"/><text x="230" y="500" font-size="14" fill="#8E8E93" font-weight="700" text-anchor="end">G</text>
<circle cx="240" cy="530" r="5" fill="#34C759"/><text x="230" y="535" font-size="14" fill="#34C759" font-weight="700" text-anchor="end">D0</text>
<rect x="760" y="430" width="200" height="125" rx="18" fill="#30B0C7" fill-opacity="0.1" stroke="#30B0C7" stroke-width="2"/>
<text x="860" y="421" font-size="16" fill="#30B0C7" font-weight="700" text-anchor="middle">ESP32 DevKit</text>
<circle cx="760" cy="460" r="5" fill="#FF9500"/><text x="770" y="465" font-size="14" fill="#FF9500" font-weight="700" text-anchor="start">3V3</text>
<circle cx="760" cy="495" r="5" fill="#8E8E93"/><text x="770" y="500" font-size="14" fill="#8E8E93" font-weight="700" text-anchor="start">GND</text>
<circle cx="760" cy="530" r="5" fill="#34C759"/><text x="770" y="535" font-size="14" fill="#34C759" font-weight="700" text-anchor="start">GPIO14</text>
<path d="M240 460 H 760" fill="none" stroke="#FF9500" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 495 H 760" fill="none" stroke="#8E8E93" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 530 H 760" fill="none" stroke="#34C759" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M40 605 H 76" fill="none" stroke="#FF3B30" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="86" y="610" font-size="14" fill="#6E6E73" font-weight="600">5 V</text>
<path d="M220 605 H 256" fill="none" stroke="#FF9500" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="266" y="610" font-size="14" fill="#6E6E73" font-weight="600">3,3 V</text>
<path d="M400 605 H 436" fill="none" stroke="#8E8E93" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="446" y="610" font-size="14" fill="#6E6E73" font-weight="600">GND (zem)</text>
<path d="M580 605 H 616" fill="none" stroke="#0A84FF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="626" y="610" font-size="14" fill="#6E6E73" font-weight="600">signál voda</text>
<path d="M760 605 H 796" fill="none" stroke="#34C759" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="806" y="610" font-size="14" fill="#6E6E73" font-weight="600">signál plyn</text>
<text x="40" y="647" font-size="15" fill="#FF3B30" font-weight="700">5 V signál nikdy priamo na pin ESP – vstupy znesú len 3,3 V.</text>
<text x="40" y="673" font-size="13" fill="#6E6E73">Farby vodičov sú najčastejšie – over si ich na štítku snímača. GND na oboch stranách konvertora je prepojené.</text>
</svg>
